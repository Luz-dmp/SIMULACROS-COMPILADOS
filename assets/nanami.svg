  <title id="nanami-title">Nanami, el zorro de Catalyst Education</title>
  <desc id="nanami-description">Ilustración de zorro naranja con orejas triangulares, antifaz de zorro, mejillas claras y cola grande alrededor del cuerpo.</desc>
